[project]
name = "agentic-model"
version = "0.1.0"
description = "Dépôt modèle pour un agent à outils"
requires-python = ">=3.13"
dependencies = [
    "openai>=3.37,<4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "PTH", "T20", "RUF"]
ignore = [
    # Convention maison : camelCase pour les variables, arguments et fonctions.
    # Écart assumé à la PEP 8, voir CONVENTIONS-PYTHON.md § 1.
    "N802", # nom de fonction non entièrement minuscule
    "N803", # nom d'argument non entièrement minuscule
    "N806", # variable locale non entièrement minuscule
    "N815", # variable en camelCase dans une classe
    "N816", # variable en camelCase au niveau module
    # Les commentaires, docstrings et messages sont en français : les
    # caractères accentués ne sont pas des « caractères ambigus ».
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Un script en ligne de commande a le droit d'afficher.
"scripts/*" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
